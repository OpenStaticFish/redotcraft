name: Setup Redot
description: Install the pinned Redot engine build, verify its checksum, and import project assets.

inputs:
  redot-version:
    description: Redot release line to install. Must match a published "<version>-stable" tag.
    required: false
    default: "26.2"
  import-project:
    description: Run a headless asset import for the checked-out project after install.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Restore cached Redot build
      id: engine-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/redot-craft
        key: redot-${{ inputs.redot-version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install Redot ${{ inputs.redot-version }}
      if: steps.engine-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        REDOT_VERSION: ${{ inputs.redot-version }}
      run: |
        set -euo pipefail
        version="${REDOT_VERSION}"
        tag="redot-${version}-stable"
        archive="Redot_v${version}-stable_linux_x64.zip"
        base="https://github.com/Redot-Engine/redot-engine/releases/download/${tag}"
        install_dir="$HOME/.cache/redot-craft"
        mkdir -p "$install_dir"

        curl -fsSL -o "$RUNNER_TEMP/$archive" "$base/$archive"
        curl -fsSL -o "$RUNNER_TEMP/SHA512-SUMS.txt" "$base/SHA512-SUMS.txt"

        expected="$(awk -v name="$archive" '$2 == "releases/" name { print $1 }' "$RUNNER_TEMP/SHA512-SUMS.txt")"
        if [[ -z "$expected" ]]; then
          echo "::error::$archive is not listed in SHA512-SUMS.txt for $tag"
          exit 1
        fi
        actual="$(sha512sum "$RUNNER_TEMP/$archive" | awk '{ print $1 }')"
        if [[ "$actual" != "$expected" ]]; then
          echo "::error::Checksum mismatch for $archive"
          exit 1
        fi

        unzip -q -o "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/redot-extract"
        install -m 0755 "$RUNNER_TEMP/redot-extract/redot.linuxbsd.editor.x86_64" "$install_dir/redot"

    - name: Add Redot to PATH
      shell: bash
      run: echo "$HOME/.cache/redot-craft" >> "$GITHUB_PATH"

    - name: Verify Redot runs
      id: verify
      shell: bash
      continue-on-error: true
      env:
        REDOT_VERSION: ${{ inputs.redot-version }}
      run: |
        set -euo pipefail
        installed="$(redot --version)"
        echo "$installed"
        if [[ "$installed" != "${REDOT_VERSION}"* ]]; then
          echo "::error::Expected Redot ${REDOT_VERSION}, got: $installed"
          exit 1
        fi

    - name: Install Redot runtime libraries
      if: steps.verify.outcome == 'failure'
      shell: bash
      run: |
        set -euo pipefail
        packages=(libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6 libfontconfig1 libdbus-1-3 libudev1)
        sudo apt-get update -qq
        if sudo apt-get install -y -qq --no-install-recommends "${packages[@]}" libasound2t64; then
          exit 0
        fi
        sudo apt-get install -y -qq --no-install-recommends "${packages[@]}" libasound2

    - name: Re-verify Redot
      if: steps.verify.outcome == 'failure'
      shell: bash
      run: redot --version

    - name: Import project assets
      if: inputs.import-project == 'true'
      shell: bash
      run: redot --headless --import --path .
